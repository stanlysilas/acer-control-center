[package]
name = "acer-control-center"
version = "2.0.0"
edition = "2024"
authors = ["Stanly Silas <vstanlysilas@gmail.com>"]
license = "GPL-3.0-or-later"
description = "Native Linux control center for Acer gaming laptops"
repository = "https://github.com/stanlysilas/acer-control-center"
rust-version = "1.88"
build = "build.rs"

[dependencies]
zbus = { version = "5", features = ["blocking"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ksni = { version = "0.3.6", features = ["blocking"] }

anyhow = "1.0"
thiserror = "2.0"

log = "0.4"
env_logger = "0.11"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
ureq = { version = "3", features = ["json"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
