name: Build and Package

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ make kmod linux-headers-generic \
            meson ninja-build pkg-config libxkbcommon-dev libwayland-dev libx11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check installer scripts
        run: bash -n install.sh uninstall.sh packaging/build-package.sh packaging/scripts/postinstall.sh packaging/scripts/postremove.sh

      - name: Build kernel driver
        working-directory: driver
        run: |
          HEADER_DIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort | tail -n1)"
          test -n "$HEADER_DIR"
          make KDIR="$HEADER_DIR"
          find . -name '*.ko' -print -quit | grep -q .

      - name: Build native library
        run: |
          meson setup target/ci-lib lib --prefix=/usr --libdir=lib --buildtype=release
          meson compile -C target/ci-lib

      - name: Check daemon and GUI
        run: |
          cargo check --locked --manifest-path daemon/Cargo.toml
          ACERCONTROL_LIB_DIR="$PWD/target/ci-lib" cargo check --locked --manifest-path gui/Cargo.toml

  packages:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            libdir: /usr/lib
          - format: rpm
            libdir: /usr/lib64
          - format: archlinux
            libdir: /usr/lib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ meson ninja-build pkg-config zstd \
            libxkbcommon-dev libwayland-dev libx11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go for nFPM
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build ${{ matrix.format }} package
        env:
          LIBDIR: ${{ matrix.libdir }}
          VERSION: 2.0.0
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          packaging/build-package.sh "${{ matrix.format }}"

      - name: Inspect package metadata
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          case "$FORMAT" in
            deb) dpkg-deb --info dist/*.deb ;;
            rpm)
              sudo apt-get install -y rpm
              rpm -qp --info dist/*.rpm
              ;;
            archlinux)
              tar --zstd -tf dist/*.pkg.tar.zst | grep -q '\.PKGINFO$'
              ;;
          esac

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: acer-package-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: acer-package-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Acer Control Center ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
